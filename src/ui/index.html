<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Hive</title>
<style>
  :root {
    --bg: #111418; --panel: #1a1f26; --text: #e6e6e6; --muted: #8a94a6; --border: #2a313b;
    --empty: #3a4250; --working: #2e9e5b; --waiting: #e0b52a; --review: #3b82f6; --danger: #d9534f;
    --code-bg: #0b0e12; --string: #d7a86e; --number: #c792ea; --keyword: #7fb4f5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; }
  header label { color: var(--muted); display: flex; gap: 8px; align-items: center; }
  input[type=number] { width: 64px; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.danger { border-color: var(--danger); color: var(--danger); }
  #signal { display: flex; gap: 6px; align-items: center; }
  button.active[data-signal=green] { border-color: var(--working); color: var(--working); }
  button.active[data-signal=yellow] { border-color: var(--waiting); color: var(--waiting); }
  button.active[data-signal=red] { border-color: var(--danger); color: var(--danger); }
  #signal-hint { color: var(--muted); }
  #usage, #limits { color: var(--muted); display: flex; flex-direction: column; gap: 2px; font-size: 12px; line-height: 1.2; }
  #usage.over { color: var(--danger); }
  #quota.low { color: var(--danger); }
  #error { display: none; background: var(--danger); color: #fff; padding: 8px 20px; }
  #error.show { display: block; }
  #notice { display: none; background: #3a3110; color: var(--waiting); padding: 8px 20px; }
  #notice.show { display: block; }
  main { display: grid; grid-template-columns: 1fr 300px; gap: 16px; padding: 16px 20px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; align-content: start; }
  .card { background: var(--panel); border: 1px solid var(--border); border-left: 6px solid var(--empty); border-radius: 8px; padding: 12px; min-height: 120px; cursor: default; }
  .card.occupied { cursor: pointer; }
  .card.working { border-left-color: var(--working); }
  .card.review { border-left-color: var(--review); }
  .card.waiting { border-left-color: var(--waiting); animation: blink 1s ease-in-out infinite; }
  .card.paused { opacity: 0.6; }
  .card .title { font-weight: 600; margin-bottom: 4px; }
  .card.draining .title { text-decoration: line-through; }
  .card .meta { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .actions { margin-top: 8px; display: flex; gap: 8px; }
  @keyframes blink { 0%, 100% { background: var(--panel); } 50% { background: #3a3110; } }
  aside { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  aside h2 { font-size: 13px; color: var(--muted); margin: 0 0 8px; text-transform: uppercase; }
  ol { margin: 0; padding-left: 20px; }
  li { margin: 4px 0; }
  #detail { display: none; }
  #detail.show { display: block; }
  #detail pre { white-space: pre-wrap; background: var(--bg); padding: 8px; border-radius: 6px; max-height: 300px; overflow: auto; }
  .hint { color: var(--muted); font-size: 12px; margin: -4px 0 10px; }
  .hint code { background: var(--bg); padding: 0 4px; border-radius: 4px; }
  #output { font: 12px/1.4 ui-monospace, monospace; min-height: 60px; max-height: 300px; overflow: auto; white-space: pre-wrap; background: var(--bg); padding: 8px; border-radius: 6px; }
  #output .code { margin: 0; padding: 6px 8px; max-height: none; background: var(--code-bg); border: 1px solid var(--border); }
  #output code { background: var(--panel); padding: 0 4px; border-radius: 4px; }
  #output .add { color: var(--working); }
  #output .del { color: var(--danger); }
  #output .hunk { color: var(--review); }
  #output .comment { color: var(--muted); font-style: italic; }
  #output .string { color: var(--string); }
  #output .number { color: var(--number); }
  #output .keyword { color: var(--keyword); }
  a { color: var(--review); }
  #setup { display: none; max-width: 760px; margin: 24px auto; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px 20px; }
  #setup h2 { font-size: 15px; margin: 0 0 12px; }
  #setup label { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; color: var(--muted); }
  #setup input[type=text], #setup select, #setup input[type=number] { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
  #setup .row { display: flex; gap: 8px; align-items: flex-end; }
  #setup .row label { flex: 1; }
  #setup fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  #setup fieldset[disabled] { display: none; }
  #setup .tabs { display: flex; gap: 20px; align-items: flex-start; }
  #setup-tabs { display: flex; flex-direction: column; gap: 4px; width: 120px; flex: none; }
  #setup-tabs button { text-align: left; }
  #setup-tabs [aria-pressed=true] { border-color: var(--review); color: var(--review); }
  #setup .panels { flex: 1; min-width: 0; }
  #rules { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
  #rules th { text-align: left; font-weight: normal; color: var(--muted); font-size: 12px; padding: 0 4px 4px 0; }
  #rules td { padding: 0 4px 4px 0; }
  #rules td button { padding: 3px 8px; font-size: 12px; }
  #setup .row button { margin-bottom: 12px; }
  #add-rule { margin-bottom: 12px; }
  #setup textarea { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px; font: 12px/1.4 ui-monospace, monospace; resize: vertical; }
  #setup-error { color: var(--danger); min-height: 1.4em; margin-bottom: 8px; white-space: pre-wrap; }
  #setup .actions { display: flex; gap: 8px; }
  body.setup #setup { display: block; }
  body.setup main, body.setup .dash, body.setup #configure { display: none; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Agent Hive</h1>
  <span id="summary" class="dash"></span>
  <!-- biome-ignore lint/a11y/noLabelWithoutControl: the span's text comes from applyTranslations, not static markup -->
  <label class="dash"><span data-i18n="maxWorkers"></span> <input id="max" type="number" min="0" step="1"></label>
  <span id="signal" class="dash">
    <button type="button" data-signal="green">green</button>
    <button type="button" data-signal="yellow">yellow</button>
    <button type="button" data-signal="red">red</button>
    <span id="signal-hint"></span>
  </span>
  <span id="usage" class="dash"></span>
  <span id="limits" class="dash"></span>
  <button type="button" id="refresh" class="dash" data-i18n="header.refresh"></button>
  <button type="button" id="configure" data-i18n="header.configure"></button>
  <span id="polled" class="dash" style="color: var(--muted); margin-left: auto;"></span>
</header>
<div id="error"></div>
<div id="notice"></div>
<form id="setup">
  <!-- biome-ignore lint/a11y/useHeadingContent: the text comes from applyTranslations, not static markup -->
  <h2 data-i18n="setup.title"></h2>
  <div class="tabs">
    <nav id="setup-tabs">
      <button type="button" data-tab="board" aria-pressed="true" data-i18n="setup.tab.board"></button>
      <button type="button" data-tab="geral" aria-pressed="false" data-i18n="setup.tab.general"></button>
      <button type="button" data-tab="limites" aria-pressed="false" data-i18n="setup.tab.limits"></button>
    </nav>
    <div class="panels">
      <section data-panel="board">
        <!-- biome-ignore lint/a11y/noLabelWithoutControl: the span's text comes from applyTranslations, not static markup -->
        <label><span data-i18n="setup.boardType"></span>
          <select id="board-type">
            <option value="github" data-i18n="setup.boardType.github"></option>
            <option value="markdown" data-i18n="setup.boardType.markdown"></option>
          </select>
        </label>
        <fieldset id="github-fields">
          <div class="row">
            <!-- biome-ignore lint/a11y/noLabelWithoutControl: the span's text comes from applyTranslations, not static markup -->
            <label><span data-i18n="setup.owner"></span> <input id="owner" type="text" value="@me" required></label>
            <button type="button" id="load-projects" data-i18n="setup.load"></button>
          </div>
          <!-- biome-ignore lint/a11y/noLabelWithoutControl: the span's text comes from applyTranslations, not static markup -->
          <label><span data-i18n="setup.project"></span> <select id="project" required><option value="" data-i18n="setup.projectPlaceholder"></option></select></label>
          <!-- biome-ignore lint/a11y/noLabelWithoutControl: the span's text comes from applyTranslations, not static markup -->
          <label><span data-i18n="setup.columnQueue"></span> <select id="col-queue" required></select></label>
          <!-- biome-ignore lint/a11y/noLabelWithoutControl: the span's text comes from applyTranslations, not static markup -->
          <label><span data-i18n="setup.columnWorking"></span> <select id="col-working" required></select></label>
          <!-- biome-ignore lint/a11y/noLabelWithoutControl: the span's text comes from applyTranslations, not static markup -->
          <label><span data-i18n="setup.columnReview"></span> <select id="col-review" required></select></label>
          <div class="hint" id="quota"></div>
          <!-- biome-ignore lint/a11y/noLabelWithoutControl: the span's text comes from applyTranslations, not static markup -->
          <label><span data-i18n="setup.epics"></span>
            <select id="epics">
              <option value="ignore" data-i18n="setup.epics.ignore"></option>
              <option value="queue" data-i18n="setup.epics.queue"></option>
            </select>
          </label>
        </fieldset>
        <fieldset id="markdown-fields" disabled>
          <div class="row">
            <!-- biome-ignore lint/a11y/noLabelWithoutControl: the span's text comes from applyTranslations, not static markup -->
            <label><span data-i18n="setup.markdownPath"></span> <input id="md-path" type="text" value="board.md" required></label>
            <button type="button" id="load-columns" data-i18n="setup.load"></button>
          </div>
          <div class="hint"><span data-i18n-html="setup.markdownHint"></span> <span id="md-found"></span></div>
          <!-- biome-ignore lint/a11y/noLabelWithoutControl: the span's text comes from applyTranslations, not static markup -->
          <label><span data-i18n="setup.columnQueue"></span> <input id="md-queue" type="text" list="md-options" value="Ready" required></label>
          <!-- biome-ignore lint/a11y/noLabelWithoutControl: the span's text comes from applyTranslations, not static markup -->
          <label><span data-i18n="setup.columnWorking"></span> <input id="md-working" type="text" list="md-options" value="In progress" required></label>
          <!-- biome-ignore lint/a11y/noLabelWithoutControl: the span's text comes from applyTranslations, not static markup -->
          <label><span data-i18n="setup.columnReview"></span> <input id="md-review" type="text" list="md-options" value="In review" required></label>
          <datalist id="md-options"></datalist>
        </fieldset>
      </section>
      <section data-panel="geral" hidden>
        <label><span data-i18n="setup.language"></span>
          <select id="language">
            <option value="pt">português</option>
            <option value="en">English</option>
          </select>
        </label>
        <!-- biome-ignore lint/a11y/noLabelWithoutControl: the span's text comes from applyTranslations, not static markup -->
        <label><span data-i18n="setup.workers"></span>
          <select id="workers-mode">
            <option value="embedded" data-i18n="setup.workers.embedded"></option>
            <option value="iterm" data-i18n="setup.workers.iterm"></option>
          </select>
        </label>
        <!-- biome-ignore lint/a11y/noLabelWithoutControl: the span's text comes from applyTranslations, not static markup -->
        <label><span data-i18n="setup.promptTemplate"></span> <textarea id="prompt-template" rows="4" spellcheck="false" data-i18n-placeholder="setup.promptPlaceholder"></textarea></label>
        <div class="hint" data-i18n-html="setup.promptHint"></div>
      </section>
      <section data-panel="limites" hidden>
        <div class="row">
          <!-- biome-ignore lint/a11y/noLabelWithoutControl: the span's text comes from applyTranslations, not static markup -->
          <label><span data-i18n="setup.budgetHour"></span> <input id="budget-hour" type="number" min="0" step="1"></label>
          <!-- biome-ignore lint/a11y/noLabelWithoutControl: the span's text comes from applyTranslations, not static markup -->
          <label><span data-i18n="setup.budgetDay"></span> <input id="budget-day" type="number" min="0" step="1"></label>
        </div>
        <div class="hint" data-i18n="setup.budgetHint"></div>
        <div class="hint" id="usage-raw"></div>
        <table id="rules">
          <thead><tr><th data-i18n="setup.rules.percent"></th><th data-i18n="maxWorkers"></th><th data-i18n="setup.rules.signal"></th><th></th></tr></thead>
          <tbody></tbody>
        </table>
        <button type="button" id="add-rule" data-i18n="setup.rules.add"></button>
        <div class="hint" data-i18n="setup.rulesHint"></div>
      </section>
    </div>
  </div>
  <div id="setup-error"></div>
  <div class="actions">
    <button type="submit" id="save" data-i18n="setup.save"></button>
    <button type="button" id="cancel" data-i18n="setup.cancel"></button>
  </div>
</form>
<main>
  <section id="grid"></section>
  <div>
    <aside id="detail">
      <!-- biome-ignore lint/a11y/useHeadingContent: the text comes from applyTranslations, not static markup -->
      <h2 data-i18n="detail.title"></h2>
      <div id="detail-body"></div>
      <div id="output"></div>
      <div class="actions" style="margin-top: 8px; display: flex; gap: 8px;">
        <button type="button" id="focus" data-i18n="detail.focus"></button>
        <button type="button" id="close" data-i18n="detail.close"></button>
      </div>
    </aside>
    <aside id="queue-panel">
      <!-- biome-ignore lint/a11y/useHeadingContent: the text comes from applyTranslations, not static markup -->
      <h2 data-i18n="queue.title"></h2>
      <ol id="queue"></ol>
    </aside>
  </div>
</main>
<script type="module" src="/ui/app.js"></script>
</body>
</html>
