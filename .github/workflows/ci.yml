name: ci

on:
  pull_request:
  push:
    branches: [main]

# nothing here writes back to the repo; the token stays read-only and is not left in .git/config
permissions:
  contents: read

# a new push to the same PR supersedes the run in flight
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # the 2-vCPU runner cannot run the four lanes side by side, so each lane (and each half of the two slow ones) gets its own runner
    strategy:
      fail-fast: true
      matrix:
        include:
          - lane: lint-types
            run: pnpm test:lint && pnpm test:types-ui
          # every boot copies the Hive's plugin into CODEX_HOME (#934): scripts/test-node.mjs gives each node lane a throwaway one
          - lane: node-1
            run: pnpm exec tsc && pnpm exec vite build && node scripts/test-node.mjs --shard=1/2
          - lane: node-2
            run: pnpm exec tsc && pnpm exec vite build && node scripts/test-node.mjs --shard=2/2
          # vitest is the slowest lane on this runner (a half measured 51-78 s), so it gets three runners
          - lane: vitest-1
            run: pnpm exec vitest run --shard=1/3
          - lane: vitest-2
            run: pnpm exec vitest run --shard=2/3
          - lane: vitest-3
            run: pnpm exec vitest run --shard=3/3
    name: ci (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 15 # the suite spawns child processes; a hung one must not hold the runner for hours
    env:
      # nothing here launches Electron; skip the ~100MB binary the postinstall would fetch
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      # the test lanes serve no diagram; the installer job does not skip it, so the installer carries the webapp (#955)
      HIVE_SKIP_DRAWIO: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, version comes from packageManager in package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.run }}

  # a job of its own, not a matrix entry: its steps differ, and it runs only the files test/windows-lane.txt names until the whole suite passes there
  windows:
    name: ci (windows)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      # the test lanes serve no diagram; the installer job does not skip it, so the installer carries the webapp (#955)
      HIVE_SKIP_DRAWIO: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, version comes from packageManager in package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # vite build now, so a leaf that lists a test reading dist/ui touches only the list
      - run: pnpm exec tsc && pnpm exec vite build && node scripts/test-node.mjs --list test/windows-lane.txt

  # The measuring run of #654: the whole suite on Windows but test/benchmark/, outside the gating lane, so its finding can size the lane #655 turns on.
  # It never fails the PR. It runs on the PR that adds it; before merge its trigger narrows to workflow_dispatch, and #655 makes it the lane.
  windows-suite:
    name: windows-suite (${{ matrix.lane }})
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 60 # the gating lane's 30 cut the first run at 28 min; this one has to end on its own to give the suite's length
    strategy:
      fail-fast: false # every shard's failures are the finding, not only the first shard's
      matrix:
        include:
          # a 5 min test timeout ends a hung test by its name, and the junit report holds every test's duration
          - lane: node-1
            run: pnpm exec tsc && pnpm exec vite build && node scripts/test-node.mjs --exclude "test/benchmark/**" --shard=1/4 --test-timeout=300000 --junit=junit/node-1.xml
          - lane: node-2
            run: pnpm exec tsc && pnpm exec vite build && node scripts/test-node.mjs --exclude "test/benchmark/**" --shard=2/4 --test-timeout=300000 --junit=junit/node-2.xml
          - lane: node-3
            run: pnpm exec tsc && pnpm exec vite build && node scripts/test-node.mjs --exclude "test/benchmark/**" --shard=3/4 --test-timeout=300000 --junit=junit/node-3.xml
          - lane: node-4
            run: pnpm exec tsc && pnpm exec vite build && node scripts/test-node.mjs --exclude "test/benchmark/**" --shard=4/4 --test-timeout=300000 --junit=junit/node-4.xml
          - lane: vitest-1
            run: pnpm exec vitest run --shard=1/3 --reporter=default --reporter=junit --outputFile.junit=junit/vitest-1.xml
          - lane: vitest-2
            run: pnpm exec vitest run --shard=2/3 --reporter=default --reporter=junit --outputFile.junit=junit/vitest-2.xml
          - lane: vitest-3
            run: pnpm exec vitest run --shard=3/3 --reporter=default --reporter=junit --outputFile.junit=junit/vitest-3.xml
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      HIVE_SKIP_DRAWIO: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, version comes from packageManager in package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir junit
      - run: ${{ matrix.run }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() # a failing or timed-out shard is the one whose report matters most
        with:
          name: windows-suite-${{ matrix.lane }}
          path: junit/
          if-no-files-found: warn
          retention-days: 14

  # Builds, installs and exercises the Windows installer (#651), then boots the installed app's daemon in setup mode (#653).
  # No ELECTRON_SKIP_BINARY_DOWNLOAD here: electron-builder packages Electron's win32-x64 build.
  installer:
    name: ci (installer)
    runs-on: windows-latest
    timeout-minutes: 20 # packaging plus an asar-less install of every node_modules file; a hung step must not hold the runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, version comes from packageManager in package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:win
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-hive-setup-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7 # an unsigned CI build, not a release
      - name: Install silently and spawn a ConPTY from the installed app
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path release\*.exe -File)
          if ($installers.Count -ne 1) { throw "expected one installer in release\, found $($installers.Count)" }
          $setup = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "the installer exited $($setup.ExitCode)" }

          # one-click per-user installs are named after package.json's name, the exe after productName
          $programs = Join-Path $env:LOCALAPPDATA 'Programs'
          $app = Join-Path $programs 'agent-hive\Agent Hive.exe'
          if (-not (Test-Path -LiteralPath $app -PathType Leaf)) {
            Get-ChildItem -Path $programs -Depth 1 -ErrorAction SilentlyContinue | Out-Host
            throw "no app at $app"
          }

          $drawio = Join-Path $programs 'agent-hive\resources\app\vendor\drawio\index.html'
          if (-not (Test-Path -LiteralPath $drawio -PathType Leaf)) { throw "no draw.io webapp at $drawio" }

          $check = Join-Path $env:RUNNER_TEMP 'conpty-check.cjs'
          Set-Content -LiteralPath $check -Encoding utf8 -Value @'
          // node-pty is required from the install, beside this exe, so the packaged copy is what is proven, not the checkout's
          const path = require('node:path');
          const pty = require(path.join(path.dirname(process.execPath), 'resources', 'app', 'node_modules', 'node-pty'));
          // cmd expands %OS% to Windows_NT, so the marker is in the child's output only: the console title repeats the command line, never its expansion
          const MARKER = 'hive-conpty-Windows_NT';
          const TIMEOUT_MS = 30000;
          let output = '';
          let exitCode;
          const finish = (code, message) => { console.log(message); process.exit(code); };
          const timer = setTimeout(() => finish(1, `no marker and exit within ${TIMEOUT_MS} ms; exit ${exitCode}; output ${JSON.stringify(output)}`), TIMEOUT_MS);
          // ConPTY may deliver the last output after the exit event, so both orders settle here
          const settle = () => {
            if (exitCode === undefined || !output.includes(MARKER)) return;
            clearTimeout(timer);
            finish(exitCode === 0 ? 0 : 1, `ConPTY: marker back, cmd.exe exited ${exitCode}`);
          };
          const child = pty.spawn('cmd.exe', ['/c', 'echo', 'hive-conpty-%OS%'], { name: 'xterm-256color', cols: 80, rows: 24, cwd: process.env.RUNNER_TEMP, env: process.env, useConpty: true });
          child.onData((data) => { output += data; settle(); });
          child.onExit((event) => { exitCode = event.exitCode; settle(); });
          '@

          $env:ELECTRON_RUN_AS_NODE = '1'
          # piped, so PowerShell waits for the GUI-subsystem exe and sets $LASTEXITCODE
          & $app $check | Out-Host
          $code = $LASTEXITCODE
          # later steps of this job (#653) must not inherit Node mode
          Remove-Item Env:ELECTRON_RUN_AS_NODE
          if ($code -ne 0) { throw "the ConPTY check exited $code" }

      - name: Boot the installed app's daemon and stop it
        shell: pwsh
        run: |
          $app = Join-Path $env:LOCALAPPDATA 'Programs\agent-hive\Agent Hive.exe'
          $runJs = Join-Path $env:LOCALAPPDATA 'Programs\agent-hive\resources\app\dist\src\run.js'
          if (-not (Test-Path -LiteralPath $runJs -PathType Leaf)) { throw "no daemon entry at $runJs" }

          # an empty home has no hive.config.json: the daemon boots in setup mode, with no token and no agent. It lives in the profile's
          # temp, as the lane's homes do: RUNNER_TEMP on D:\ inherits BUILTIN\Users' read from the drive, which the home check refuses (#628)
          $home_ = Join-Path ([System.IO.Path]::GetTempPath()) 'smoke-home'
          New-Item -ItemType Directory -Force -Path $home_ | Out-Null
          $out = Join-Path $env:RUNNER_TEMP 'smoke-out.txt'
          $err = Join-Path $env:RUNNER_TEMP 'smoke-err.txt'

          # the variables are set for this Start-Process only: the child inherits them, the rest of the job does not
          $env:HIVE_HOME = $home_
          $env:ELECTRON_RUN_AS_NODE = '1'
          $daemon = Start-Process -FilePath $app -ArgumentList "`"$runJs`"" -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          Remove-Item Env:HIVE_HOME, Env:ELECTRON_RUN_AS_NODE
          # read once now: without an open handle, ExitCode is null for a process that exited before anyone asked
          $null = $daemon.Handle

          try {
            $portFile = Join-Path $home_ 'hive.port'
            $secretFile = Join-Path $home_ 'hive.secret'
            $deadline = (Get-Date).AddSeconds(60)
            while (-not ((Test-Path -LiteralPath $portFile) -and (Test-Path -LiteralPath $secretFile))) {
              if ($daemon.HasExited) { throw "the daemon exited $($daemon.ExitCode) before it answered" }
              if ((Get-Date) -gt $deadline) { throw 'no hive.port and hive.secret within 60 s' }
              Start-Sleep -Milliseconds 200
            }
            $port = [int](Get-Content -LiteralPath $portFile -Raw).Trim()
            # hive.secret is one line, `x-hive-secret: <secret>`: the header as it goes on the wire
            $secret = ((Get-Content -LiteralPath $secretFile -Raw).Trim() -split ':\s*', 2)[1]
            $headers = @{ 'x-hive-secret' = $secret; 'x-hive-ui' = '1' }

            $page = Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -Headers $headers -UseBasicParsing
            if ($page.StatusCode -ne 200) { throw "GET / answered $($page.StatusCode)" }

            # the daemon closes every connection right after its answer: the exit code below is the verdict, not this call
            try {
              Invoke-WebRequest -Uri "http://127.0.0.1:$port/stop" -Method Post -Headers $headers -ContentType 'application/json' -Body '{}' -UseBasicParsing | Out-Null
            } catch { Write-Host "POST /stop: $_" }
            if (-not $daemon.WaitForExit(30000)) { throw 'the daemon did not exit within 30 s of /stop' }
            if ($daemon.ExitCode -ne 0) { throw "the daemon exited $($daemon.ExitCode) after /stop" }
          } catch {
            Write-Host "smoke failed: $_"
            foreach ($file in @((Join-Path $home_ 'hive.log'), $out, $err)) {
              Write-Host "--- $file"
              if (Test-Path -LiteralPath $file) { Get-Content -LiteralPath $file | Out-Host }
            }
            throw
          } finally {
            if (-not $daemon.HasExited) { Stop-Process -Id $daemon.Id -Force }
          }
