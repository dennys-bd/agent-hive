name: ci

on:
  pull_request:
  push:
    branches: [main]

# nothing here writes back to the repo; the token stays read-only and is not left in .git/config
permissions:
  contents: read

# a new push to the same PR supersedes the run in flight
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # the 2-vCPU runner cannot run the four lanes side by side, so each lane (and each half of the two slow ones) gets its own runner
    strategy:
      fail-fast: true
      matrix:
        include:
          - lane: lint-types
            run: pnpm test:lint && pnpm test:types-ui
          # every boot copies the Hive's plugin into CODEX_HOME (#934): the node lanes give it a throwaway one, as test:node does
          - lane: node-1
            run: pnpm exec tsc && pnpm exec vite build && CODEX_HOME="$(mktemp -d)" node --test --test-shard=1/2 "dist/test/*.test.js" "dist/test/agents/*.test.js" "dist/test/sources/*.test.js" "dist/test/read-model/*.test.js" "dist/test/benchmark/*.test.js"
          - lane: node-2
            run: pnpm exec tsc && pnpm exec vite build && CODEX_HOME="$(mktemp -d)" node --test --test-shard=2/2 "dist/test/*.test.js" "dist/test/agents/*.test.js" "dist/test/sources/*.test.js" "dist/test/read-model/*.test.js" "dist/test/benchmark/*.test.js"
          # vitest is the slowest lane on this runner (a half measured 51-78 s), so it gets three runners
          - lane: vitest-1
            run: pnpm exec vitest run --shard=1/3
          - lane: vitest-2
            run: pnpm exec vitest run --shard=2/3
          - lane: vitest-3
            run: pnpm exec vitest run --shard=3/3
    name: ci (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 15 # the suite spawns child processes; a hung one must not hold the runner for hours
    env:
      # nothing here launches Electron; skip the ~100MB binary the postinstall would fetch
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, version comes from packageManager in package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.run }}
