name: probe-windows (#601, throwaway)

on:
  push:
    branches: [probe/601-windows]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: pnpm install as is
        continue-on-error: true
        run: pnpm install --frozen-lockfile
      - name: pnpm install without scripts, then rebuild node-pty
        continue-on-error: true
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild node-pty
          node -e "require('node-pty'); console.log('node-pty loads')"
      - name: claude via npm
        continue-on-error: true
        run: |
          npm i -g @anthropic-ai/claude-code
          claude --version
      - name: claude via native installer
        continue-on-error: true
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          & "$env:USERPROFILE\.local\bin\claude.exe" --version
      - name: probe round 2
        run: node probe/round2.mjs
