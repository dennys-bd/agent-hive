<svg xmlns="http://www.w3.org/2000/svg" viewBox="-264 -264 528 528" width="528" height="528">
  <title>Agent Hive: red</title>
  <!-- Menu bar icon with the signal badge (#196): the honeycomb of trayTemplate.svg in black, for a light bar, and a filled hexagon in
       the SignalStrip's red (src/ui/index.css) in the bottom-right corner. The mask cuts the walls around the badge so it reads apart
       from the comb. Not a template image: macOS draws it as is. -->
  <defs>
    <polygon id="hex" points="0,-88 76,-44 76,44 0,88 -76,44 -76,-44"/>
    <mask id="gap" maskUnits="userSpaceOnUse" x="-264" y="-264" width="528" height="528">
      <rect x="-264" y="-264" width="528" height="528" fill="#ffffff"/>
      <polygon points="160,-24 306,60 306,228 160,312 14,228 14,60" fill="#000000"/>
    </mask>
  </defs>
  <g stroke="#000000" stroke-width="40" stroke-linejoin="round" fill="none" mask="url(#gap)">
    <use href="#hex" x="-84" y="-146"/>
    <use href="#hex" x="84" y="-146"/>
    <use href="#hex" x="168" y="0"/>
    <use href="#hex" x="84" y="146"/>
    <use href="#hex" x="-84" y="146"/>
    <use href="#hex" x="-168" y="0"/>
    <use href="#hex" fill="#000000"/>
  </g>
  <polygon points="160,24 264,84 264,204 160,264 56,204 56,84" fill="#d9534f"/>
</svg>
