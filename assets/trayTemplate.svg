<svg xmlns="http://www.w3.org/2000/svg" viewBox="-264 -264 528 528" width="528" height="528">
  <title>Agent Hive</title>
  <!-- Menu bar template (#191): the honeycomb of icon.svg in black on transparent; macOS tints it for a light or dark bar.
       Stroke 40 (icon.svg uses 22) so the walls survive 16 px; the viewBox is the comb plus half a stroke. -->
  <defs>
    <polygon id="hex" points="0,-88 76,-44 76,44 0,88 -76,44 -76,-44"/>
  </defs>
  <g stroke="#000000" stroke-width="40" stroke-linejoin="round" fill="none">
    <use href="#hex" x="-84" y="-146"/>
    <use href="#hex" x="84" y="-146"/>
    <use href="#hex" x="168" y="0"/>
    <use href="#hex" x="84" y="146"/>
    <use href="#hex" x="-84" y="146"/>
    <use href="#hex" x="-168" y="0"/>
    <use href="#hex" fill="#000000"/>
  </g>
</svg>
